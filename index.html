@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#05080B;--fg:#F2F6F8;--dim:#9AA8B3;--cyan:#76C8E4;--pad:clamp(20px,4vw,56px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Serac Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;min-height:100vh;min-height:100svh;overflow-x:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.6s ease}
#scene.on{opacity:1}
.no-gl body{background:radial-gradient(120% 70% at 50% 108%,rgba(118,200,228,.16),rgba(118,200,228,0) 62%),var(--bg)}
.top{position:absolute;z-index:2;top:clamp(20px,4.6vh,46px);left:var(--pad)}
.logo{display:block;width:clamp(112px,10.5vw,164px);height:auto;opacity:0;animation:fade 1.6s .15s ease forwards}
.hero{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(110px,18vh,200px) 24px 0}
.eyebrow{display:inline-flex;align-items:center;gap:11px;margin:0 0 clamp(18px,2.8vh,30px);font-size:11.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-feature-settings:"case" 1,"tnum" 1;opacity:0;animation:fade 1s .45s ease forwards}
.eyebrow-text{display:inline-block;text-align:left;white-space:nowrap}
.dot{position:relative;flex:none;width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px rgba(118,200,228,.9)}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--cyan);animation:ping 2.6s cubic-bezier(.2,.6,.3,1) 1.2s infinite;opacity:0}
h1{margin:0;font-weight:300;font-size:clamp(2.1rem,3.2vw,3.55rem);line-height:1.08;letter-spacing:-.022em;font-feature-settings:"ss01" 1}
h1 span{display:inline-block;white-space:nowrap;opacity:0;transform:translateY(16px);filter:blur(10px);animation:rise 1.25s cubic-bezier(.2,.7,.2,1) forwards}
h1 span:nth-child(1){animation-delay:.75s}
h1 span:nth-child(2){animation-delay:.95s}
h1 span:nth-child(3){animation-delay:1.15s}
.lede{margin:clamp(18px,2.6vh,28px) 0 0;font-size:clamp(15px,1.12vw,17px);line-height:1.6;color:var(--dim);opacity:0;transform:translateY(10px);animation:rise 1.2s cubic-bezier(.2,.7,.2,1) 1.65s forwards}
.lede b{font-weight:400;color:var(--fg)}
.cta-wrap{margin-top:clamp(26px,4.2vh,42px);opacity:0;transform:translateY(10px);animation:rise 1.2s cubic-bezier(.2,.7,.2,1) 2.15s forwards}
.cta{position:relative;display:inline-flex;align-items:center;gap:.7em;padding:16px 28px 16px 31px;border-radius:999px;font:500 15px/1 "Serac Inter",system-ui,sans-serif;letter-spacing:.01em;color:var(--fg);text-decoration:none;background:rgba(8,14,19,.66);border:1px solid rgba(242,246,248,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .6s ease}
.cta::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0deg,transparent 240deg,rgba(118,200,228,.9) 300deg,rgba(242,246,248,.95) 322deg,transparent 352deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5.5s linear infinite;pointer-events:none;transition:opacity .35s ease}
.cta .arrow{display:inline-block;transition:transform .35s ease}
.cta:hover,.cta:focus-visible{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 0 44px 2px rgba(118,200,228,.3)}
.cta:hover::before,.cta:focus-visible::before{opacity:0}
.cta:hover .arrow,.cta:focus-visible .arrow{transform:translateX(4px)}
.cta:focus-visible{outline:2px solid var(--cyan);outline-offset:5px}
.addr{margin:15px 0 0;font-size:12.5px;letter-spacing:.04em;color:rgba(154,168,179,.78);user-select:all;-webkit-user-select:all;opacity:0;animation:fade 1.2s 2.6s ease forwards}
footer{position:fixed;z-index:2;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:16px;padding:48px var(--pad) max(clamp(18px,3.6vh,36px),env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(5,8,11,.92),rgba(5,8,11,.6) 45%,rgba(5,8,11,0));font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(154,168,179,.62);pointer-events:none;opacity:0;animation:fade 1.6s 2.9s ease forwards}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.75}80%,100%{transform:scale(3.6);opacity:0}}
@keyframes spin{to{--a:360deg}}
@media (max-width:1000px){h1 span{display:block}h1{font-size:clamp(2.1rem,7.4vw,3.2rem);line-height:1.1}}
@media (max-width:560px){.hero{padding-top:clamp(96px,14vh,128px)}h1{font-size:1.9rem}.eyebrow{margin-bottom:18px}.lede{font-size:15px;max-width:22em;margin-top:16px}.cta-wrap{margin-top:26px}.cta{padding:15px 26px 15px 28px}footer{font-size:9.5px;letter-spacing:.16em}}
@media (max-height:620px) and (min-width:700px){.hero{padding-top:84px}h1{font-size:clamp(1.8rem,2.6vw,2.6rem)}.cta-wrap{margin-top:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}.dot::after{display:none}#scene{transition:none}}
</style>
